<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="2200"
  height="720"
  viewBox="0 0 1100 360"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Tideproof evidence, proposal, authority, and recovery boundaries</title>
  <desc id="description">
    Untrusted evidence passes through CockroachDB provenance, validity, scope,
    and conflict checks before vector ranking. An agent can propose but cannot
    authorize. A separate serializable transaction issues one fenced receipt.
    Managed MCP returns context only and never authority.
  </desc>
  <metadata>
    Tideproof clean-room architecture diagram. Synthetic scope. See
    docs/ARCHITECTURE.md and docs/media/RIGHTS.md.
  </metadata>
