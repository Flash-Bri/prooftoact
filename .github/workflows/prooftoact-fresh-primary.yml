name: ProofToAct Fresh Cluster And Primary

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Exact approved one-shot fresh-cluster operation UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prooftoact-fresh-cluster-caller-${{ inputs.operation_id }}
  cancel-in-progress: false

jobs:
  exact-source:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      authority_commit: ${{ steps.identity.outputs.authority_commit }}
      authority_tree: ${{ steps.identity.outputs.authority_tree }}
      operation_id: ${{ steps.identity.outputs.operation_id }}
    steps:
      - name: Check out the exact dispatched main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          persist-credentials: false
          ref: ${{ github.sha }}
          show-progress: false
          submodules: false

      - name: Bind the exact source identity without provider authority
        id: identity
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW" == "ProofToAct Fresh Cluster And Primary" ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPERATION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git remote get-url origin)" = "https://github.com/Flash-Bri/prooftoact"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          authority_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$authority_tree" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' \
            "authority_commit=$EXPECTED_COMMIT" \
            "authority_tree=$authority_tree" \
            "operation_id=$OPERATION_ID" >> "$GITHUB_OUTPUT"

  sealed-fresh-cluster-and-primary:
    needs: exact-source
    if: ${{ needs.exact-source.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: Flash-Bri/prooftoact/.github/workflows/prooftoact-sealed-fresh-primary.yml@50d0cd261b8597fe74c80b84c49be0adde5bdf6f
    with:
      authority_commit: ${{ needs.exact-source.outputs.authority_commit }}
      authority_tree: ${{ needs.exact-source.outputs.authority_tree }}
      operation_id: ${{ needs.exact-source.outputs.operation_id }}
