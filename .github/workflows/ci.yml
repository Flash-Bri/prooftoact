name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify proof manifest
        run: npm run proof:verify

      - name: Verify current claim surfaces
        run: npm run claims:verify

      - name: Verify current-surface rights inventory
        run: npm run rights:verify

      - name: Verify bounded release privacy controls
        run: npm run privacy:verify

      - name: Verify current source security boundaries
        run: npm run security:verify

      - name: Verify fail-closed submission draft
        run: npm run submission:verify

      - name: Verify bounded static accessibility controls
        run: npm run accessibility:verify

      - name: Verify rendered browser accessibility controls
        run: npm run accessibility:browser

      - name: Verify locked dependency inventory
        run: npm run dependencies:verify

      - name: Verify bundled third-party notices
        run: npm run licenses:verify

      - name: Verify exact release provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run release:provenance

      - name: Run deterministic tests
        run: npm test

      - name: Audit locked dependencies
        run: npm audit --audit-level=low

      - name: Rebuild Gate Two artifacts
        run: npm run build:gate2

      - name: Verify official-main release readiness wrapper
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run gate2:aws-readiness:local
