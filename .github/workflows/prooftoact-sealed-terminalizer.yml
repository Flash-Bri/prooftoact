name: ProofToAct Sealed Terminalizer Credential Boundary

on:
  workflow_call:
    inputs:
      artifact_name: { required: true, type: string }
      authority_commit: { required: true, type: string }
      authority_tree: { required: true, type: string }
      command_sha256: { required: true, type: string }
      manifest_sha256: { required: true, type: string }

permissions: {}

jobs:
  sealed-credential-boundary:
    permissions: {}
    environment: aws-release-terminalization
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject activation until a reviewed sealed terminalizer exists
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
          AUTHORITY_TREE: ${{ inputs.authority_tree }}
          COMMAND_SHA256: ${{ inputs.command_sha256 }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          [[ "$ARTIFACT_NAME" =~ ^prooftoact-sealed-terminalizer-[0-9]+-[0-9]+$ ]]
          [[ "$AUTHORITY_COMMIT" =~ ^[0-9a-f]{40}$ && "$AUTHORITY_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COMMAND_SHA256" =~ ^[0-9a-f]{64}$ && "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo 'HOLD:SEALED_TERMINALIZER_RUNTIME_NOT_IMPLEMENTED' >&2
          exit 1
