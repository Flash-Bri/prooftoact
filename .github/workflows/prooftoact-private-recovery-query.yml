name: ProofToAct Private Recovery Query

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execute once or perform read-only reconciliation
        required: true
        type: choice
        options:
          - reconcile-only
          - execute
      operation_id:
        description: Exact approved operation UUID
        required: true
        type: string

permissions: {}

jobs:
  private-recovery-query:
    permissions:
      contents: read
      id-token: write
    # The caller and protected OIDC trust both bind the reviewed Commit A source.
    uses: Flash-Bri/prooftoact/.github/workflows/prooftoact-sealed-private-recovery-query.yml@caf417dd84d899c7407e5ed12f56b60f1b74d32a
    with:
      authority_commit: "caf417dd84d899c7407e5ed12f56b60f1b74d32a"
      authority_tree: "b01bf525dd47eb7ad6ed412e9557010289c6836b"
      mode: ${{ inputs.mode }}
      operation_id: ${{ inputs.operation_id }}
    secrets: inherit
