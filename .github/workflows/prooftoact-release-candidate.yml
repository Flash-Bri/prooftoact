name: ProofToAct Release Candidate

on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Verify the PREPARE source contract without OIDC or provider access
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: prooftoact-release-prepare-one-shot
  cancel-in-progress: false

jobs:
  prepare-diagnostic:
    if: ${{ github.ref == 'refs/heads/main' && inputs.diagnostic_only }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          path: control-plane
          persist-credentials: false
          ref: ${{ github.sha }}
          show-progress: false
          submodules: false

      - name: Check out frozen application source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          path: frozen-application
          persist-credentials: false
          ref: 963937a9873f0199b91897fe88da1b91bc84b5e3
          show-progress: false
          submodules: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: false
          node-version: 22.23.1

      - name: Normalize exact separate checkouts
        working-directory: control-plane
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ github.sha }}
          GIT_OPTIONAL_LOCKS: "0"
          NODE_COMPILE_CACHE: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_REPL_EXTERNAL_MODULE: ""
          NODE_V8_COVERAGE: ""
        run: node scripts/normalize-release-control-checkouts.js

      - name: Verify frozen application identity and directory separation
        working-directory: frozen-application
        env:
          EXPECTED_APP_COMMIT: 963937a9873f0199b91897fe88da1b91bc84b5e3
          EXPECTED_APP_TREE: a330e0d57328e63a568be73c523b2cae6338f26c
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_APP_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_APP_TREE"
          test "$GITHUB_WORKSPACE/frozen-application" != "$GITHUB_WORKSPACE/control-plane"

      - name: Install exact hermetic control dependencies
        working-directory: control-plane
        env:
          NODE_COMPILE_CACHE: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: |
          npm ci --ignore-scripts --prefix release-control
          npm ci --ignore-scripts --prefix release-provider

      - name: Verify PREPARE without token or provider capability
        working-directory: control-plane
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ github.sha }}
          NODE_COMPILE_CACHE: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_REPL_EXTERNAL_MODULE: ""
          NODE_V8_COVERAGE: ""
          PROOFTOACT_RELEASE_PHASE_ENVIRONMENT: DIAGNOSTIC_NO_PROVIDER
        run: |
          node scripts/run-release-prepare-diagnostic.js
          node --test test/release-control-checkout-normalizer.test.js test/release-prepare-runner.test.js test/release-provider-one-shot-broker.test.js test/release-provider-runtime.test.js test/release-provider-runtime-loader.test.js

  coordinator-reserve:
    if: ${{ github.ref == 'refs/heads/main' && !inputs.diagnostic_only }}
    permissions:
      contents: read
    environment: aws-release-coordination
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.seal.outputs.artifact_name }}
      authority_commit: ${{ steps.seal.outputs.authority_commit }}
      authority_tree: ${{ steps.seal.outputs.authority_tree }}
      command_base64: ${{ steps.seal.outputs.command_base64 }}
      command_sha256: ${{ steps.seal.outputs.command_sha256 }}
      manifest_base64: ${{ steps.seal.outputs.manifest_base64 }}
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}

    steps:
      - name: Check out exact control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          path: control-plane
          persist-credentials: false
          ref: ${{ github.sha }}
          show-progress: false
          submodules: false

      - name: Check out frozen application source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          path: frozen-application
          persist-credentials: false
          ref: 963937a9873f0199b91897fe88da1b91bc84b5e3
          show-progress: false
          submodules: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: false
          node-version: 22.23.1

      - name: Normalize exact separate checkouts before OIDC
        working-directory: control-plane
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ github.sha }}
          GIT_OPTIONAL_LOCKS: "0"
          NODE_COMPILE_CACHE: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_REPL_EXTERNAL_MODULE: ""
          NODE_V8_COVERAGE: ""
        run: node scripts/normalize-release-control-checkouts.js

      - name: Install exact hermetic executable dependencies before OIDC
        working-directory: control-plane
        env:
          NODE_COMPILE_CACHE: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: |
          npm ci --ignore-scripts --prefix release-control
          npm ci --ignore-scripts --prefix release-provider

      - name: Generate hash-bound non-executable coordinator reserve seal
        id: seal
        working-directory: control-plane
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          ARTIFACT_NAME: prooftoact-sealed-coordinator-${{ github.run_id }}-${{ github.run_attempt }}-reserve
          SEAL_ROOT: ${{ runner.temp }}/prooftoact-sealed-coordinator-reserve
        run: |
          authority_commit="$(git rev-parse HEAD)"
          authority_tree="$(git rev-parse HEAD^{tree})"
          receipt="$(node scripts/build-release-credential-seal.js "$SEAL_ROOT" coordinator aws-release-coordination reserve "$authority_commit" "$authority_tree")"
          command_base64="$(jq -er '.commandBase64' <<<"$receipt")"
          command_sha256="$(jq -er '.commandSha256' <<<"$receipt")"
          manifest_base64="$(jq -er '.manifestBase64' <<<"$receipt")"
          manifest_sha256="$(jq -er '.manifestSha256' <<<"$receipt")"
          printf '%s\n' \
            "artifact_name=$ARTIFACT_NAME" \
            "authority_commit=$authority_commit" \
            "authority_tree=$authority_tree" \
            "command_base64=$command_base64" \
            "command_sha256=$command_sha256" \
            "manifest_base64=$manifest_base64" \
            "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload only the non-executable reserve seal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.seal.outputs.artifact_name }}
          path: ${{ runner.temp }}/prooftoact-sealed-coordinator-reserve/*
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 1

  provider-dispatch:
    needs: coordinator-reserve
    if: ${{ github.ref == 'refs/heads/main' && !inputs.diagnostic_only && needs.coordinator-reserve.result == 'success' }}
    permissions:
      contents: read
    environment: aws-release-deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_name: ${{ steps.seal.outputs.artifact_name }}
      authority_commit: ${{ steps.seal.outputs.authority_commit }}
      authority_tree: ${{ steps.seal.outputs.authority_tree }}
      command_base64: ${{ steps.seal.outputs.command_base64 }}
      command_sha256: ${{ steps.seal.outputs.command_sha256 }}
      manifest_base64: ${{ steps.seal.outputs.manifest_base64 }}
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}

    steps:
      - name: Check out exact control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          path: control-plane
          persist-credentials: false
          ref: ${{ github.sha }}
          show-progress: false
          submodules: false

      - name: Check out frozen application source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          path: frozen-application
          persist-credentials: false
          ref: 963937a9873f0199b91897fe88da1b91bc84b5e3
          show-progress: false
          submodules: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: false
          node-version: 22.23.1

      - name: Normalize exact separate checkouts before OIDC
        working-directory: control-plane
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ github.sha }}
          GIT_OPTIONAL_LOCKS: "0"
          NODE_COMPILE_CACHE: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_REPL_EXTERNAL_MODULE: ""
          NODE_V8_COVERAGE: ""
        run: node scripts/normalize-release-control-checkouts.js

      - name: Build exact frozen application artifacts before OIDC
        working-directory: frozen-application
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          NODE_COMPILE_CACHE: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: |
          umask 077
          npm ci --ignore-scripts
          node scripts/build-gate2-exact.js > "${RUNNER_TEMP}/prooftoact-gate2-build-receipt.json"

      - name: Build exact provider capability bundles before OIDC
        working-directory: control-plane
        env:
          NODE_COMPILE_CACHE: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: |
          npm ci --ignore-scripts --prefix release-control
          npm ci --ignore-scripts --prefix release-provider

      - name: Generate hash-bound non-executable PREPARE dispatch seal
        id: seal
        working-directory: control-plane
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          ARTIFACT_NAME: prooftoact-sealed-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          SEAL_ROOT: ${{ runner.temp }}/prooftoact-sealed-prepare-dispatch
        run: |
          authority_commit="$(git rev-parse HEAD)"
          authority_tree="$(git rev-parse HEAD^{tree})"
          receipt="$(node scripts/build-release-credential-seal.js "$SEAL_ROOT" prepare aws-release-deployment dispatch "$authority_commit" "$authority_tree")"
          command_base64="$(jq -er '.commandBase64' <<<"$receipt")"
          command_sha256="$(jq -er '.commandSha256' <<<"$receipt")"
          manifest_base64="$(jq -er '.manifestBase64' <<<"$receipt")"
          manifest_sha256="$(jq -er '.manifestSha256' <<<"$receipt")"
          printf '%s\n' \
            "artifact_name=$ARTIFACT_NAME" \
            "authority_commit=$authority_commit" \
            "authority_tree=$authority_tree" \
            "command_base64=$command_base64" \
            "command_sha256=$command_sha256" \
            "manifest_base64=$manifest_base64" \
            "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload only the non-executable PREPARE seal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.seal.outputs.artifact_name }}
          path: ${{ runner.temp }}/prooftoact-sealed-prepare-dispatch/*
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 1

  coordinator-finalize:
    needs:
      - coordinator-reserve
      - provider-dispatch
    if: ${{ always() && github.ref == 'refs/heads/main' && !inputs.diagnostic_only && needs.coordinator-reserve.result == 'success' }}
    permissions:
      contents: read
    environment: aws-release-coordination
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      artifact_name: ${{ steps.seal.outputs.artifact_name }}
      authority_commit: ${{ steps.seal.outputs.authority_commit }}
      authority_tree: ${{ steps.seal.outputs.authority_tree }}
      command_base64: ${{ steps.seal.outputs.command_base64 }}
      command_sha256: ${{ steps.seal.outputs.command_sha256 }}
      manifest_base64: ${{ steps.seal.outputs.manifest_base64 }}
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}

    steps:
      - name: Check out exact control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          path: control-plane
          persist-credentials: false
          ref: ${{ github.sha }}
          show-progress: false
          submodules: false

      - name: Check out frozen application source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          path: frozen-application
          persist-credentials: false
          ref: 963937a9873f0199b91897fe88da1b91bc84b5e3
          show-progress: false
          submodules: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: false
          node-version: 22.23.1

      - name: Normalize exact separate checkouts before OIDC
        working-directory: control-plane
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ github.sha }}
          GIT_OPTIONAL_LOCKS: "0"
          NODE_COMPILE_CACHE: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_REPL_EXTERNAL_MODULE: ""
          NODE_V8_COVERAGE: ""
        run: node scripts/normalize-release-control-checkouts.js

      - name: Build exact frozen application artifacts before OIDC
        working-directory: frozen-application
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          NODE_COMPILE_CACHE: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: |
          umask 077
          npm ci --ignore-scripts
          node scripts/build-gate2-exact.js > "${RUNNER_TEMP}/prooftoact-gate2-build-receipt.json"

      - name: Build exact coordinator and readback bundles before OIDC
        working-directory: control-plane
        env:
          NODE_COMPILE_CACHE: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: |
          npm ci --ignore-scripts --prefix release-control
          npm ci --ignore-scripts --prefix release-provider

      - name: Generate hash-bound non-executable coordinator finalize seal
        id: seal
        working-directory: control-plane
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          ARTIFACT_NAME: prooftoact-sealed-coordinator-${{ github.run_id }}-${{ github.run_attempt }}-finalize
          SEAL_ROOT: ${{ runner.temp }}/prooftoact-sealed-coordinator-finalize
        run: |
          authority_commit="$(git rev-parse HEAD)"
          authority_tree="$(git rev-parse HEAD^{tree})"
          receipt="$(node scripts/build-release-credential-seal.js "$SEAL_ROOT" coordinator aws-release-coordination finalize "$authority_commit" "$authority_tree")"
          command_base64="$(jq -er '.commandBase64' <<<"$receipt")"
          command_sha256="$(jq -er '.commandSha256' <<<"$receipt")"
          manifest_base64="$(jq -er '.manifestBase64' <<<"$receipt")"
          manifest_sha256="$(jq -er '.manifestSha256' <<<"$receipt")"
          printf '%s\n' \
            "artifact_name=$ARTIFACT_NAME" \
            "authority_commit=$authority_commit" \
            "authority_tree=$authority_tree" \
            "command_base64=$command_base64" \
            "command_sha256=$command_sha256" \
            "manifest_base64=$manifest_base64" \
            "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload only the non-executable finalize seal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.seal.outputs.artifact_name }}
          path: ${{ runner.temp }}/prooftoact-sealed-coordinator-finalize/*
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 1

  sealed-coordinator-reserve:
    needs: coordinator-reserve
    if: ${{ github.ref == 'refs/heads/main' && !inputs.diagnostic_only && needs.coordinator-reserve.result == 'success' }}
    uses: Flash-Bri/prooftoact/.github/workflows/prooftoact-sealed-coordinator.yml@50d0cd261b8597fe74c80b84c49be0adde5bdf6f
    with:
      authority_commit: ${{ needs.coordinator-reserve.outputs.authority_commit }}
      authority_tree: ${{ needs.coordinator-reserve.outputs.authority_tree }}
      command_base64: ${{ needs.coordinator-reserve.outputs.command_base64 }}
      command_sha256: ${{ needs.coordinator-reserve.outputs.command_sha256 }}
      manifest_base64: ${{ needs.coordinator-reserve.outputs.manifest_base64 }}
      manifest_sha256: ${{ needs.coordinator-reserve.outputs.manifest_sha256 }}
      phase: reserve

  sealed-provider-dispatch:
    needs:
      - provider-dispatch
      - sealed-coordinator-reserve
    if: ${{ github.ref == 'refs/heads/main' && !inputs.diagnostic_only && needs.provider-dispatch.result == 'success' && needs.sealed-coordinator-reserve.result == 'success' }}
    uses: Flash-Bri/prooftoact/.github/workflows/prooftoact-sealed-prepare.yml@50d0cd261b8597fe74c80b84c49be0adde5bdf6f
    with:
      authority_commit: ${{ needs.provider-dispatch.outputs.authority_commit }}
      authority_tree: ${{ needs.provider-dispatch.outputs.authority_tree }}
      command_base64: ${{ needs.provider-dispatch.outputs.command_base64 }}
      command_sha256: ${{ needs.provider-dispatch.outputs.command_sha256 }}
      manifest_base64: ${{ needs.provider-dispatch.outputs.manifest_base64 }}
      manifest_sha256: ${{ needs.provider-dispatch.outputs.manifest_sha256 }}

  sealed-coordinator-finalize:
    needs:
      - coordinator-finalize
      - sealed-provider-dispatch
    if: ${{ always() && github.ref == 'refs/heads/main' && !inputs.diagnostic_only && needs.coordinator-finalize.result == 'success' && needs.sealed-provider-dispatch.result == 'success' }}
    uses: Flash-Bri/prooftoact/.github/workflows/prooftoact-sealed-coordinator.yml@50d0cd261b8597fe74c80b84c49be0adde5bdf6f
    with:
      authority_commit: ${{ needs.coordinator-finalize.outputs.authority_commit }}
      authority_tree: ${{ needs.coordinator-finalize.outputs.authority_tree }}
      command_base64: ${{ needs.coordinator-finalize.outputs.command_base64 }}
      command_sha256: ${{ needs.coordinator-finalize.outputs.command_sha256 }}
      manifest_base64: ${{ needs.coordinator-finalize.outputs.manifest_base64 }}
      manifest_sha256: ${{ needs.coordinator-finalize.outputs.manifest_sha256 }}
      phase: finalize
