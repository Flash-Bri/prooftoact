name: ProofToAct Release Candidate

on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Verify the PREPARE source contract without OIDC or provider access
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: prooftoact-release-prepare-one-shot
  cancel-in-progress: false

jobs:
  prepare-diagnostic:
    if: ${{ github.ref == 'refs/heads/main' && inputs.diagnostic_only }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          path: control-plane
          persist-credentials: false
          ref: ${{ github.sha }}
          show-progress: false
          submodules: false

      - name: Check out frozen application source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          path: frozen-application
          persist-credentials: false
          ref: 963937a9873f0199b91897fe88da1b91bc84b5e3
          show-progress: false
          submodules: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: false
          node-version: 22.23.1

      - name: Normalize exact separate checkouts
        working-directory: control-plane
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ github.sha }}
          GIT_OPTIONAL_LOCKS: "0"
          NODE_COMPILE_CACHE: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_REPL_EXTERNAL_MODULE: ""
          NODE_V8_COVERAGE: ""
        run: node scripts/normalize-release-control-checkouts.js

      - name: Verify frozen application identity and directory separation
        working-directory: frozen-application
        env:
          EXPECTED_APP_COMMIT: 963937a9873f0199b91897fe88da1b91bc84b5e3
          EXPECTED_APP_TREE: a330e0d57328e63a568be73c523b2cae6338f26c
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_APP_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_APP_TREE"
          test "$GITHUB_WORKSPACE/frozen-application" != "$GITHUB_WORKSPACE/control-plane"

      - name: Install exact hermetic control dependencies
        working-directory: control-plane
        env:
          NODE_COMPILE_CACHE: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: |
          npm ci --ignore-scripts --prefix release-control
          npm ci --ignore-scripts --prefix release-provider

      - name: Verify PREPARE without token or provider capability
        working-directory: control-plane
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ github.sha }}
          NODE_COMPILE_CACHE: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_REPL_EXTERNAL_MODULE: ""
          NODE_V8_COVERAGE: ""
          PROOFTOACT_RELEASE_PHASE_ENVIRONMENT: DIAGNOSTIC_NO_PROVIDER
        run: |
          node scripts/run-release-prepare-diagnostic.js
          node --test test/release-control-checkout-normalizer.test.js test/release-prepare-runner.test.js test/release-provider-one-shot-broker.test.js test/release-provider-runtime.test.js test/release-provider-runtime-loader.test.js

  coordinator-reserve:
    if: ${{ github.ref == 'refs/heads/main' && !inputs.diagnostic_only }}
    permissions:
      contents: read
      id-token: write
    environment: aws-release-coordination
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      lookup_b64: ${{ steps.reserve.outputs.lookup_b64 }}

    steps:
      - name: Check out exact control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          path: control-plane
          persist-credentials: false
          ref: ${{ github.sha }}
          show-progress: false
          submodules: false

      - name: Check out frozen application source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          path: frozen-application
          persist-credentials: false
          ref: 963937a9873f0199b91897fe88da1b91bc84b5e3
          show-progress: false
          submodules: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: false
          node-version: 22.23.1

      - name: Normalize exact separate checkouts before OIDC
        working-directory: control-plane
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ github.sha }}
          GIT_OPTIONAL_LOCKS: "0"
          NODE_COMPILE_CACHE: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_REPL_EXTERNAL_MODULE: ""
          NODE_V8_COVERAGE: ""
        run: node scripts/normalize-release-control-checkouts.js

      - name: Install exact hermetic executable dependencies before OIDC
        working-directory: control-plane
        env:
          NODE_COMPILE_CACHE: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: |
          npm ci --ignore-scripts --prefix release-control
          npm ci --ignore-scripts --prefix release-provider

      - name: Require protected bootstrap evidence and rebuild signed executable manifest before OIDC
        working-directory: control-plane
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ github.sha }}
          NODE_COMPILE_CACHE: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_REPL_EXTERNAL_MODULE: ""
          NODE_V8_COVERAGE: ""
          PROOFTOACT_RELEASE_BOOTSTRAP_RECEIPT_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_RECEIPT_SHA256 }}
          PROOFTOACT_RELEASE_BOOTSTRAP_STACK_ID_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_STACK_ID_SHA256 }}
          PROOFTOACT_RELEASE_BOOTSTRAP_STATUS: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_STATUS }}
          PROOFTOACT_RELEASE_BOOTSTRAP_TEMPLATE_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_TEMPLATE_SHA256 }}
          PROOFTOACT_RELEASE_CONTROL_TABLE_ID: ${{ vars.PROOFTOACT_RELEASE_CONTROL_TABLE_ID }}
          PROOFTOACT_RELEASE_PHASE_ENVIRONMENT: aws-release-coordination
          PROOFTOACT_RELEASE_PREPARE_APPROVAL_B64: ${{ secrets.PROOFTOACT_RELEASE_PREPARE_APPROVAL_B64 }}
          PROOFTOACT_RELEASE_ROLE_ARN: ${{ secrets.PROOFTOACT_RELEASE_COORDINATOR_ROLE_ARN }}
        run: node scripts/run-release-prepare-preflight.js reserve

      - name: Assume only the release coordinator role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          disable-retry: true
          mask-aws-account-id: true
          output-env-credentials: true
          role-duration-seconds: 900
          role-session-name: pta-${{ github.run_id }}-${{ github.run_attempt }}-coordinator-reserve
          role-to-assume: ${{ secrets.PROOFTOACT_RELEASE_COORDINATOR_ROLE_ARN }}
          unset-current-credentials: true

      - name: Atomically reserve budget and append one durable intent
        id: reserve
        working-directory: control-plane
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ github.sha }}
          NODE_COMPILE_CACHE: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_REPL_EXTERNAL_MODULE: ""
          NODE_V8_COVERAGE: ""
          PROOFTOACT_RELEASE_PHASE_ENVIRONMENT: aws-release-coordination
          PROOFTOACT_RELEASE_BOOTSTRAP_RECEIPT_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_RECEIPT_SHA256 }}
          PROOFTOACT_RELEASE_BOOTSTRAP_STACK_ID_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_STACK_ID_SHA256 }}
          PROOFTOACT_RELEASE_BOOTSTRAP_STATUS: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_STATUS }}
          PROOFTOACT_RELEASE_BOOTSTRAP_TEMPLATE_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_TEMPLATE_SHA256 }}
          PROOFTOACT_RELEASE_CONTROL_TABLE_ID: ${{ vars.PROOFTOACT_RELEASE_CONTROL_TABLE_ID }}
          PROOFTOACT_RELEASE_PREPARE_APPROVAL_B64: ${{ secrets.PROOFTOACT_RELEASE_PREPARE_APPROVAL_B64 }}
          PROOFTOACT_RELEASE_ROLE_ARN: ${{ secrets.PROOFTOACT_RELEASE_COORDINATOR_ROLE_ARN }}
        run: node scripts/run-release-prepare-phase.js reserve

  provider-dispatch:
    needs: coordinator-reserve
    if: ${{ github.ref == 'refs/heads/main' && !inputs.diagnostic_only && needs.coordinator-reserve.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    environment: aws-release-deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out exact control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          path: control-plane
          persist-credentials: false
          ref: ${{ github.sha }}
          show-progress: false
          submodules: false

      - name: Check out frozen application source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          path: frozen-application
          persist-credentials: false
          ref: 963937a9873f0199b91897fe88da1b91bc84b5e3
          show-progress: false
          submodules: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: false
          node-version: 22.23.1

      - name: Normalize exact separate checkouts before OIDC
        working-directory: control-plane
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ github.sha }}
          GIT_OPTIONAL_LOCKS: "0"
          NODE_COMPILE_CACHE: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_REPL_EXTERNAL_MODULE: ""
          NODE_V8_COVERAGE: ""
        run: node scripts/normalize-release-control-checkouts.js

      - name: Build exact frozen application artifacts before OIDC
        working-directory: frozen-application
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          NODE_COMPILE_CACHE: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: |
          umask 077
          npm ci --ignore-scripts
          node scripts/build-gate2-exact.js > "${RUNNER_TEMP}/prooftoact-gate2-build-receipt.json"

      - name: Build exact provider capability bundles before OIDC
        working-directory: control-plane
        env:
          NODE_COMPILE_CACHE: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: |
          npm ci --ignore-scripts --prefix release-control
          npm ci --ignore-scripts --prefix release-provider

      - name: Require protected bootstrap evidence and rebuild signed executable manifest before OIDC
        working-directory: control-plane
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ github.sha }}
          NODE_COMPILE_CACHE: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_REPL_EXTERNAL_MODULE: ""
          NODE_V8_COVERAGE: ""
          PROOFTOACT_RELEASE_BOOTSTRAP_RECEIPT_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_RECEIPT_SHA256 }}
          PROOFTOACT_RELEASE_BOOTSTRAP_STACK_ID_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_STACK_ID_SHA256 }}
          PROOFTOACT_RELEASE_BOOTSTRAP_STATUS: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_STATUS }}
          PROOFTOACT_RELEASE_BOOTSTRAP_TEMPLATE_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_TEMPLATE_SHA256 }}
          PROOFTOACT_RELEASE_CONTROL_TABLE_ID: ${{ vars.PROOFTOACT_RELEASE_CONTROL_TABLE_ID }}
          PROOFTOACT_RELEASE_PHASE_ENVIRONMENT: aws-release-deployment
          PROOFTOACT_RELEASE_PREPARE_APPROVAL_B64: ${{ secrets.PROOFTOACT_RELEASE_PREPARE_APPROVAL_B64 }}
          PROOFTOACT_RELEASE_PREPARE_PRIVATE_CONFIG_B64: ${{ secrets.PROOFTOACT_RELEASE_PREPARE_PRIVATE_CONFIG_B64 }}
          PROOFTOACT_RELEASE_ROLE_ARN: ${{ secrets.PROOFTOACT_RELEASE_DEPLOYMENT_ROLE_ARN }}
        run: node scripts/run-release-prepare-preflight.js dispatch

      - name: Assume only the PREPARE deployment role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          disable-retry: true
          mask-aws-account-id: true
          output-env-credentials: true
          role-duration-seconds: 900
          role-session-name: pta-${{ github.run_id }}-${{ github.run_attempt }}-provider-dispatch
          role-to-assume: ${{ secrets.PROOFTOACT_RELEASE_DEPLOYMENT_ROLE_ARN }}
          unset-current-credentials: true

      - name: Strongly reread intent and perform one bounded PREPARE dispatch
        working-directory: control-plane
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ github.sha }}
          NODE_COMPILE_CACHE: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_REPL_EXTERNAL_MODULE: ""
          NODE_V8_COVERAGE: ""
          PROOFTOACT_RELEASE_BUILD_RECEIPT_PATH: ${{ runner.temp }}/prooftoact-gate2-build-receipt.json
          PROOFTOACT_RELEASE_PHASE_ENVIRONMENT: aws-release-deployment
          PROOFTOACT_RELEASE_BOOTSTRAP_RECEIPT_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_RECEIPT_SHA256 }}
          PROOFTOACT_RELEASE_BOOTSTRAP_STACK_ID_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_STACK_ID_SHA256 }}
          PROOFTOACT_RELEASE_BOOTSTRAP_STATUS: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_STATUS }}
          PROOFTOACT_RELEASE_BOOTSTRAP_TEMPLATE_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_TEMPLATE_SHA256 }}
          PROOFTOACT_RELEASE_CONTROL_TABLE_ID: ${{ vars.PROOFTOACT_RELEASE_CONTROL_TABLE_ID }}
          PROOFTOACT_RELEASE_PREPARE_APPROVAL_B64: ${{ secrets.PROOFTOACT_RELEASE_PREPARE_APPROVAL_B64 }}
          PROOFTOACT_RELEASE_PREPARE_LOOKUP_B64: ${{ needs.coordinator-reserve.outputs.lookup_b64 }}
          PROOFTOACT_RELEASE_PREPARE_PRIVATE_CONFIG_B64: ${{ secrets.PROOFTOACT_RELEASE_PREPARE_PRIVATE_CONFIG_B64 }}
          PROOFTOACT_RELEASE_ROLE_ARN: ${{ secrets.PROOFTOACT_RELEASE_DEPLOYMENT_ROLE_ARN }}
        run: node scripts/run-release-prepare-phase.js dispatch

  coordinator-finalize:
    needs:
      - coordinator-reserve
      - provider-dispatch
    if: ${{ always() && github.ref == 'refs/heads/main' && !inputs.diagnostic_only && needs.coordinator-reserve.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    environment: aws-release-coordination
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out exact control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          path: control-plane
          persist-credentials: false
          ref: ${{ github.sha }}
          show-progress: false
          submodules: false

      - name: Check out frozen application source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          lfs: false
          path: frozen-application
          persist-credentials: false
          ref: 963937a9873f0199b91897fe88da1b91bc84b5e3
          show-progress: false
          submodules: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: false
          node-version: 22.23.1

      - name: Normalize exact separate checkouts before OIDC
        working-directory: control-plane
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ github.sha }}
          GIT_OPTIONAL_LOCKS: "0"
          NODE_COMPILE_CACHE: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_REPL_EXTERNAL_MODULE: ""
          NODE_V8_COVERAGE: ""
        run: node scripts/normalize-release-control-checkouts.js

      - name: Build exact frozen application artifacts before OIDC
        working-directory: frozen-application
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          NODE_COMPILE_CACHE: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: |
          umask 077
          npm ci --ignore-scripts
          node scripts/build-gate2-exact.js > "${RUNNER_TEMP}/prooftoact-gate2-build-receipt.json"

      - name: Build exact coordinator and readback bundles before OIDC
        working-directory: control-plane
        env:
          NODE_COMPILE_CACHE: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
        run: |
          npm ci --ignore-scripts --prefix release-control
          npm ci --ignore-scripts --prefix release-provider

      - name: Require protected bootstrap evidence and rebuild signed executable manifest before OIDC
        working-directory: control-plane
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ github.sha }}
          NODE_COMPILE_CACHE: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_REPL_EXTERNAL_MODULE: ""
          NODE_V8_COVERAGE: ""
          PROOFTOACT_RELEASE_BOOTSTRAP_RECEIPT_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_RECEIPT_SHA256 }}
          PROOFTOACT_RELEASE_BOOTSTRAP_STACK_ID_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_STACK_ID_SHA256 }}
          PROOFTOACT_RELEASE_BOOTSTRAP_STATUS: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_STATUS }}
          PROOFTOACT_RELEASE_BOOTSTRAP_TEMPLATE_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_TEMPLATE_SHA256 }}
          PROOFTOACT_RELEASE_CONTROL_TABLE_ID: ${{ vars.PROOFTOACT_RELEASE_CONTROL_TABLE_ID }}
          PROOFTOACT_RELEASE_PHASE_ENVIRONMENT: aws-release-coordination
          PROOFTOACT_RELEASE_PREPARE_APPROVAL_B64: ${{ secrets.PROOFTOACT_RELEASE_PREPARE_APPROVAL_B64 }}
          PROOFTOACT_RELEASE_PREPARE_PRIVATE_CONFIG_B64: ${{ secrets.PROOFTOACT_RELEASE_PREPARE_PRIVATE_CONFIG_B64 }}
          PROOFTOACT_RELEASE_ROLE_ARN: ${{ secrets.PROOFTOACT_RELEASE_COORDINATOR_ROLE_ARN }}
        run: node scripts/run-release-prepare-preflight.js finalize

      - name: Assume only the release coordinator role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-east-1
          disable-retry: true
          mask-aws-account-id: true
          output-env-credentials: true
          role-duration-seconds: 900
          role-session-name: pta-${{ github.run_id }}-${{ github.run_attempt }}-coordinator-finalize
          role-to-assume: ${{ secrets.PROOFTOACT_RELEASE_COORDINATOR_ROLE_ARN }}
          unset-current-credentials: true

      - name: Ignore dispatcher claims and finalize only from fresh readback
        working-directory: control-plane
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ github.sha }}
          NODE_COMPILE_CACHE: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          NODE_PATH: ""
          NODE_REPL_EXTERNAL_MODULE: ""
          NODE_V8_COVERAGE: ""
          PROOFTOACT_RELEASE_BUILD_RECEIPT_PATH: ${{ runner.temp }}/prooftoact-gate2-build-receipt.json
          PROOFTOACT_RELEASE_PHASE_ENVIRONMENT: aws-release-coordination
          PROOFTOACT_RELEASE_BOOTSTRAP_RECEIPT_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_RECEIPT_SHA256 }}
          PROOFTOACT_RELEASE_BOOTSTRAP_STACK_ID_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_STACK_ID_SHA256 }}
          PROOFTOACT_RELEASE_BOOTSTRAP_STATUS: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_STATUS }}
          PROOFTOACT_RELEASE_BOOTSTRAP_TEMPLATE_SHA256: ${{ vars.PROOFTOACT_RELEASE_BOOTSTRAP_TEMPLATE_SHA256 }}
          PROOFTOACT_RELEASE_CONTROL_TABLE_ID: ${{ vars.PROOFTOACT_RELEASE_CONTROL_TABLE_ID }}
          PROOFTOACT_RELEASE_PREPARE_APPROVAL_B64: ${{ secrets.PROOFTOACT_RELEASE_PREPARE_APPROVAL_B64 }}
          PROOFTOACT_RELEASE_PREPARE_LOOKUP_B64: ${{ needs.coordinator-reserve.outputs.lookup_b64 }}
          PROOFTOACT_RELEASE_PREPARE_PRIVATE_CONFIG_B64: ${{ secrets.PROOFTOACT_RELEASE_PREPARE_PRIVATE_CONFIG_B64 }}
          PROOFTOACT_RELEASE_ROLE_ARN: ${{ secrets.PROOFTOACT_RELEASE_COORDINATOR_ROLE_ARN }}
        run: node scripts/run-release-prepare-phase.js finalize
