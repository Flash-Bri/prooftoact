name: ProofToAct Sealed Coordinator Credential Boundary

on:
  workflow_call:
    inputs:
      command_base64:
        required: true
        type: string
      authority_commit:
        required: true
        type: string
      authority_tree:
        required: true
        type: string
      command_sha256:
        required: true
        type: string
      manifest_base64:
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string
      phase:
        required: true
        type: string

permissions: {}

jobs:
  sealed-credential-boundary:
    permissions:
      id-token: write
    environment: aws-release-coordination
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Validate immutable artifact coordinates
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
          AUTHORITY_TREE: ${{ inputs.authority_tree }}
          COMMAND_BASE64: ${{ inputs.command_base64 }}
          COMMAND_SHA256: ${{ inputs.command_sha256 }}
          MANIFEST_BASE64: ${{ inputs.manifest_base64 }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          PHASE: ${{ inputs.phase }}
        run: |
          [[ "$AUTHORITY_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AUTHORITY_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$COMMAND_BASE64" =~ ^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$ ]]
          [[ "$COMMAND_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$MANIFEST_BASE64" =~ ^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$ ]]
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "${#COMMAND_BASE64}" -le 8192 && "${#MANIFEST_BASE64}" -le 8192 ]]
          [[ "$PHASE" == "reserve" || "$PHASE" == "finalize" ]]

      - name: Verify exact non-executable command and manifest bytes
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          AUTHORITY_COMMIT: ${{ inputs.authority_commit }}
          AUTHORITY_TREE: ${{ inputs.authority_tree }}
          COMMAND_BASE64: ${{ inputs.command_base64 }}
          COMMAND_SHA256: ${{ inputs.command_sha256 }}
          MANIFEST_BASE64: ${{ inputs.manifest_base64 }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          PHASE: ${{ inputs.phase }}
          SEALED_ROOT: ${{ runner.temp }}/prooftoact-sealed-input
        run: |
          umask 077
          mkdir "$SEALED_ROOT"
          [[ -d "$SEALED_ROOT" && ! -L "$SEALED_ROOT" ]]
          printf '%s' "$COMMAND_BASE64" | base64 --decode > "$SEALED_ROOT/command.json"
          printf '%s' "$MANIFEST_BASE64" | base64 --decode > "$SEALED_ROOT/manifest.json"
          mapfile -d '' sealed_files < <(find "$SEALED_ROOT" -mindepth 1 -maxdepth 1 -print0)
          [[ "${#sealed_files[@]}" -eq 2 ]]
          for file in "$SEALED_ROOT/command.json" "$SEALED_ROOT/manifest.json"; do
            [[ -f "$file" && ! -L "$file" ]]
            [[ "$(stat -c '%h' "$file")" == "1" ]]
            [[ "$(stat -c '%s' "$file")" -le 4096 ]]
          done
          [[ "$(base64 < "$SEALED_ROOT/command.json" | tr -d '\n')" == "$COMMAND_BASE64" ]]
          [[ "$(base64 < "$SEALED_ROOT/manifest.json" | tr -d '\n')" == "$MANIFEST_BASE64" ]]
          [[ "$(sha256sum "$SEALED_ROOT/command.json" | cut -d' ' -f1)" == "$COMMAND_SHA256" ]]
          [[ "$(sha256sum "$SEALED_ROOT/manifest.json" | cut -d' ' -f1)" == "$MANIFEST_SHA256" ]]
          jq -e --arg commit "$AUTHORITY_COMMIT" --arg tree "$AUTHORITY_TREE" \
            --arg command "$COMMAND_SHA256" --arg phase "$PHASE" '
            (keys | sort) == ["authorityCommit","authorityTree","commandSha256","environment","lane","phase","schemaVersion","status"] and
            .schemaVersion == "prooftoact.sealed-credential-manifest.v1" and
            .status == "HASH_BOUND_NOT_EXECUTABLE" and
            .lane == "COORDINATOR" and
            .environment == "aws-release-coordination" and
            .phase == $phase and .authorityCommit == $commit and
            .authorityTree == $tree and .commandSha256 == $command
          ' "$SEALED_ROOT/manifest.json" >/dev/null
          jq -e --arg commit "$AUTHORITY_COMMIT" --arg tree "$AUTHORITY_TREE" \
            --arg phase "$PHASE" '
            (keys | sort) == ["action","authorityCommit","authorityTree","lane","phase","schemaVersion"] and
            .schemaVersion == "prooftoact.sealed-credential-command.v1" and
            .action == "HOLD_NO_PROVIDER_EXECUTION" and
            .lane == "COORDINATOR" and .phase == $phase and
            .authorityCommit == $commit and .authorityTree == $tree
          ' "$SEALED_ROOT/command.json" >/dev/null

      - name: Hold before AWS credential configuration
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          echo 'HOLD:SEALED_COORDINATOR_RUNTIME_NOT_ACTIVATED' >&2
          exit 1
