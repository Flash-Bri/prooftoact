name: AWS OIDC Identity Bootstrap

on:
  workflow_dispatch:
    inputs:
      official_main_commit:
        description: Exact 40-character official main commit expected for this run
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-oidc-identity-bootstrap
  cancel-in-progress: false

jobs:
  identity-bootstrap:
    environment: aws-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Capture encrypted assumed-role identity receipt
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          EXPECTED_OFFICIAL_MAIN_COMMIT: ${{ inputs.official_main_commit }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_APPROVED_ACCOUNT_ID_SHA256: ${{ vars.AWS_APPROVED_ACCOUNT_ID_SHA256 }}
          RECEIPT_ENCRYPTION_PASSPHRASE: ${{ secrets.RECEIPT_ENCRYPTION_PASSPHRASE }}
          BASH_ENV: ""
          ENV: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          umask 077

          oidc_response=""
          oidc_token=""
          oidc_header=""
          oidc_payload=""
          sts_response=""
          caller_receipt=""
          passphrase_file=""
          error_file=""
          gnupg_home=""
          encrypted_receipt="${RUNNER_TEMP}/aws-preflight-caller-receipt.json.gpg"

          cleanup_sensitive_files() {
            if [[ -n "$gnupg_home" &&
                  "$gnupg_home" == "${RUNNER_TEMP}"/receipt-gnupg.?????? &&
                  -d "$gnupg_home" && ! -L "$gnupg_home" ]]; then
              if ! /usr/bin/gpgconf --homedir "$gnupg_home" --kill all \
                >/dev/null 2>&1; then
                :
              fi
              if ! /usr/bin/rm -rf -- "$gnupg_home"; then
                :
              fi
            fi
            for file in \
              "$oidc_response" \
              "$oidc_token" \
              "$oidc_header" \
              "$oidc_payload" \
              "$sts_response" \
              "$caller_receipt" \
              "$passphrase_file" \
              "$error_file"; do
              if [[ -n "$file" ]]; then
                /usr/bin/rm -f -- "$file"
              fi
            done
          }
          trap cleanup_sensitive_files EXIT

          fail_closed() {
            printf '%s\n' \
              '::error::AWS identity bootstrap failed closed.' >&2
            exit 1
          }

          fail_closed_stage() {
            local stage="${1:-}"
            case "$stage" in
              AWS_IDENTITY_STAGE_STS_ASSUME_REQUEST | \
              AWS_IDENTITY_STAGE_STS_ASSUME_RECEIPT | \
              AWS_IDENTITY_STAGE_STS_ASSUME_FIELDS | \
              AWS_IDENTITY_STAGE_STS_CALLER_REQUEST | \
              AWS_IDENTITY_STAGE_STS_CALLER_RECEIPT | \
              AWS_IDENTITY_STAGE_RECEIPT_ENCRYPTION_PREPARE | \
              AWS_IDENTITY_STAGE_RECEIPT_ENCRYPTION | \
              AWS_IDENTITY_STAGE_RECEIPT_ENCRYPTION_CLEANUP | \
              AWS_IDENTITY_STAGE_ENCRYPTED_RECEIPT) ;;
              *) fail_closed ;;
            esac
            printf '%s\n' "::error::${stage}" >&2
            exit 1
          }

          [[ "$(/usr/bin/id -u)" != "0" ]] || fail_closed
          [[ "${GITHUB_ACTIONS:-}" == "true" ]] || fail_closed
          [[ "${CI:-}" == "true" ]] || fail_closed
          [[ "${RUNNER_OS:-}" == "Linux" ]] || fail_closed
          [[ "${GITHUB_SERVER_URL:-}" == "https://github.com" ]] || fail_closed
          [[ "${GITHUB_API_URL:-}" == "https://api.github.com" ]] || fail_closed
          [[ "${GITHUB_REPOSITORY:-}" == "Flash-Bri/prooftoact" ]] || fail_closed
          [[ "${GITHUB_REPOSITORY_ID:-}" == "1317716765" ]] || fail_closed
          [[ "${GITHUB_REF:-}" == "refs/heads/main" ]] || fail_closed
          [[ "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" ]] || fail_closed
          [[ "${GITHUB_WORKFLOW:-}" == "AWS OIDC Identity Bootstrap" ]] || fail_closed
          [[ "${GITHUB_WORKFLOW_REF:-}" == "Flash-Bri/prooftoact/.github/workflows/aws-oidc-identity-bootstrap.yml@refs/heads/main" ]] || fail_closed
          [[ "${GITHUB_JOB:-}" == "identity-bootstrap" ]] || fail_closed
          [[ "${EXPECTED_OFFICIAL_MAIN_COMMIT:-}" =~ ^[0-9a-f]{40}$ ]] || fail_closed
          [[ "${GITHUB_SHA:-}" == "$EXPECTED_OFFICIAL_MAIN_COMMIT" ]] || fail_closed
          [[ "${RUNNER_ENVIRONMENT:-}" == "github-hosted" ]] || fail_closed
          [[ "${RUNNER_TEMP:-}" == /* && -d "$RUNNER_TEMP" ]] || fail_closed
          for unsafe_name in \
            ALL_PROXY \
            AWS_CA_BUNDLE \
            AWS_CONFIG_FILE \
            AWS_CONTAINER_AUTHORIZATION_TOKEN \
            AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE \
            AWS_CONTAINER_CREDENTIALS_FULL_URI \
            AWS_CONTAINER_CREDENTIALS_RELATIVE_URI \
            AWS_DATA_PATH \
            AWS_DEFAULT_PROFILE \
            AWS_PROFILE \
            AWS_ROLE_SESSION_NAME \
            AWS_SDK_LOAD_CONFIG \
            AWS_SHARED_CREDENTIALS_FILE \
            AWS_USE_DUALSTACK_ENDPOINT \
            AWS_USE_FIPS_ENDPOINT \
            AWS_WEB_IDENTITY_TOKEN_FILE \
            BOTO_CONFIG \
            CURL_CA_BUNDLE \
            GNUPGHOME \
            HTTPS_PROXY \
            HTTP_PROXY \
            NODE_DEBUG \
            NODE_TLS_REJECT_UNAUTHORIZED \
            NODE_V8_COVERAGE \
            NO_PROXY \
            REQUESTS_CA_BUNDLE \
            SSL_CERT_DIR \
            SSL_CERT_FILE; do
            [[ -z "${!unsafe_name:-}" ]] || fail_closed
          done
          while IFS= read -r unsafe_name; do
            [[ -z "${!unsafe_name:-}" ]] || fail_closed
          done < <(compgen -A variable AWS_ENDPOINT_URL)
          unset unsafe_name
          [[ "${AWS_ACCOUNT_ID:-}" =~ ^[0-9]{12}$ ]] || fail_closed
          [[ "${AWS_APPROVED_ACCOUNT_ID_SHA256:-}" =~ ^[0-9a-f]{64}$ ]] || fail_closed
          account_digest="$(printf '%s' "$AWS_ACCOUNT_ID" | /usr/bin/sha256sum)" || fail_closed
          account_digest="${account_digest%% *}"
          [[ "$account_digest" == "$AWS_APPROVED_ACCOUNT_ID_SHA256" ]] || fail_closed
          unset account_digest AWS_APPROVED_ACCOUNT_ID_SHA256
          expected_role_arn="arn:aws:iam::${AWS_ACCOUNT_ID}:role/ProofToActPreflight"
          [[ "${AWS_ROLE_ARN:-}" == "$expected_role_arn" ]] || fail_closed
          expected_caller_arn="arn:aws:sts::${AWS_ACCOUNT_ID}:assumed-role/ProofToActPreflight/release-proof"
          [[ "${RECEIPT_ENCRYPTION_PASSPHRASE:-}" =~ ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$ ]] || fail_closed
          oidc_request_url="${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          (( ${#oidc_request_url} >= 1 && ${#oidc_request_url} <= 2048 )) || fail_closed
          oidc_request_url_pattern='^https://(pipelines|run-actions-[0-9]+-[a-z0-9]([a-z0-9-]*[a-z0-9])?)\.actions\.githubusercontent\.com/[^[:space:]?#]+\?[^[:space:]#]+$'
          [[ "$oidc_request_url" =~ $oidc_request_url_pattern ]] || fail_closed
          unset oidc_request_url_pattern
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || fail_closed

          aws_candidate="/usr/local/bin/aws"
          [[ -L "$aws_candidate" ]] || fail_closed
          aws_cli="$(/usr/bin/readlink -f -- "$aws_candidate")" || fail_closed
          [[ "$aws_cli" =~ ^/usr/local/aws-cli/v2/[0-9]+\.[0-9]+\.[0-9]+/dist/aws$ ]] || fail_closed
          aws_metadata="$(/usr/bin/stat -Lc '%u:%a:%F' -- "$aws_cli")" || fail_closed
          IFS=':' read -r aws_uid aws_mode aws_type <<<"$aws_metadata"
          [[ "$aws_uid" == "0" ]] || fail_closed
          [[ "$aws_mode" =~ ^[0-7]{3,4}$ ]] || fail_closed
          [[ "$aws_type" == "regular file" ]] || fail_closed
          aws_mode_value=$((8#$aws_mode))
          (( (aws_mode_value & 0111) != 0 )) || fail_closed
          (( (aws_mode_value & 0022) == 0 )) || fail_closed
          unset aws_metadata aws_uid aws_mode aws_type aws_mode_value

          for crypto_cli in /usr/bin/gpg /usr/bin/gpgconf; do
            crypto_metadata="$(/usr/bin/stat -Lc '%u:%a:%F' -- "$crypto_cli")" || fail_closed
            IFS=':' read -r crypto_uid crypto_mode crypto_type <<<"$crypto_metadata"
            [[ "$crypto_uid" == "0" ]] || fail_closed
            [[ "$crypto_mode" =~ ^[0-7]{3,4}$ ]] || fail_closed
            [[ "$crypto_type" == "regular file" ]] || fail_closed
            crypto_mode_value=$((8#$crypto_mode))
            (( (crypto_mode_value & 0111) != 0 )) || fail_closed
            (( (crypto_mode_value & 0022) == 0 )) || fail_closed
          done
          unset crypto_cli crypto_metadata crypto_uid crypto_mode crypto_type crypto_mode_value

          oidc_response="$(/usr/bin/mktemp "${RUNNER_TEMP}/oidc-response.XXXXXX")" || fail_closed
          oidc_token="$(/usr/bin/mktemp "${RUNNER_TEMP}/oidc-token.XXXXXX")" || fail_closed
          oidc_header="$(/usr/bin/mktemp "${RUNNER_TEMP}/oidc-header.XXXXXX")" || fail_closed
          oidc_payload="$(/usr/bin/mktemp "${RUNNER_TEMP}/oidc-payload.XXXXXX")" || fail_closed
          sts_response="$(/usr/bin/mktemp "${RUNNER_TEMP}/sts-response.XXXXXX")" || fail_closed
          caller_receipt="$(/usr/bin/mktemp "${RUNNER_TEMP}/caller-receipt.XXXXXX")" || fail_closed
          passphrase_file="$(/usr/bin/mktemp "${RUNNER_TEMP}/receipt-passphrase.XXXXXX")" || fail_closed
          error_file="$(/usr/bin/mktemp "${RUNNER_TEMP}/bootstrap-error.XXXXXX")" || fail_closed
          gnupg_home="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/receipt-gnupg.XXXXXX")" || fail_closed
          [[ "$gnupg_home" == "${RUNNER_TEMP}"/receipt-gnupg.?????? ]] || fail_closed
          /usr/bin/chmod 600 \
            "$oidc_response" \
            "$oidc_token" \
            "$oidc_header" \
            "$oidc_payload" \
            "$sts_response" \
            "$caller_receipt" \
            "$passphrase_file" \
            "$error_file" || fail_closed
          /usr/bin/chmod 700 "$gnupg_home" || fail_closed
          [[ -d "$gnupg_home" && ! -L "$gnupg_home" ]] || fail_closed
          gnupg_metadata="$(/usr/bin/stat -c '%u:%a:%F' -- "$gnupg_home")" || fail_closed
          IFS=':' read -r gnupg_uid gnupg_mode gnupg_type <<<"$gnupg_metadata"
          [[ "$gnupg_uid" == "$(/usr/bin/id -u)" ]] || fail_closed
          [[ "$gnupg_mode" == "700" ]] || fail_closed
          [[ "$gnupg_type" == "directory" ]] || fail_closed
          unset gnupg_metadata gnupg_uid gnupg_mode gnupg_type

          oidc_url="${oidc_request_url}&audience=sts.amazonaws.com"
          if ! /usr/bin/timeout --signal=KILL 30s \
            /usr/bin/curl \
              --disable \
              --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --max-time 20 \
            --fail \
            --silent \
            --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$oidc_url" >"$oidc_response" 2>"$error_file"; then
            fail_closed
          fi
          if ! /usr/bin/jq -e \
            'type == "object" and
             keys == ["value"] and
             (.value | type == "string" and
              test("^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"))' \
            "$oidc_response" >/dev/null 2>"$error_file"; then
            fail_closed
          fi
          if ! /usr/bin/jq -j '.value' "$oidc_response" \
            >"$oidc_token" 2>"$error_file"; then
            fail_closed
          fi
          [[ -s "$oidc_token" ]] || fail_closed

          token_value="$(<"$oidc_token")"
          IFS='.' read -r jwt_header jwt_payload jwt_signature jwt_extra <<<"$token_value"
          [[ -n "$jwt_header" && -n "$jwt_payload" && -n "$jwt_signature" && -z "$jwt_extra" ]] || fail_closed
          decode_base64url() {
            local encoded="$1"
            local destination="$2"
            local normalized="${encoded//-/+}"
            normalized="${normalized//_/\/}"
            case $(( ${#normalized} % 4 )) in
              0) ;;
              2) normalized="${normalized}==" ;;
              3) normalized="${normalized}=" ;;
              *) return 1 ;;
            esac
            printf '%s' "$normalized" | /usr/bin/base64 --decode \
              >"$destination" 2>"$error_file"
          }
          decode_base64url "$jwt_header" "$oidc_header" || fail_closed
          decode_base64url "$jwt_payload" "$oidc_payload" || fail_closed
          unset token_value jwt_header jwt_payload jwt_signature jwt_extra
          if ! /usr/bin/jq -e \
            'type == "object" and
             .alg == "RS256" and
             .typ == "JWT" and
             (.kid | type == "string" and length > 0)' \
            "$oidc_header" >/dev/null 2>"$error_file"; then
            fail_closed
          fi
          oidc_now="$(/usr/bin/date +%s)" || fail_closed
          if ! /usr/bin/jq -e \
            --arg sha "$EXPECTED_OFFICIAL_MAIN_COMMIT" \
            --argjson now "$oidc_now" \
            'type == "object" and
             .iss == "https://token.actions.githubusercontent.com" and
             .aud == "sts.amazonaws.com" and
             .repository == "Flash-Bri/prooftoact" and
             .repository_id == "1317716765" and
             .repository_owner == "Flash-Bri" and
             .repository_owner_id == "252500266" and
             .ref == "refs/heads/main" and
             .ref_type == "branch" and
             .environment == "aws-preflight" and
             .sub == "repo:Flash-Bri@252500266/prooftoact@1317716765:environment:aws-preflight" and
             .workflow == "AWS OIDC Identity Bootstrap" and
             .workflow_ref == "Flash-Bri/prooftoact/.github/workflows/aws-oidc-identity-bootstrap.yml@refs/heads/main" and
             .workflow_sha == $sha and
             .event_name == "workflow_dispatch" and
             .runner_environment == "github-hosted" and
             .sha == $sha and
             (.jti | type == "string" and length > 0) and
             (.iat | type == "number" and . >= ($now - 600) and . <= ($now + 60)) and
             (.nbf | type == "number" and . <= ($now + 60)) and
             (.exp | type == "number" and . > $now and . <= ($now + 600)) and
             (.exp > .iat)' \
            "$oidc_payload" >/dev/null 2>"$error_file"; then
            fail_closed
          fi
          unset oidc_now

          unset \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            AWS_SESSION_TOKEN \
            AWS_PROFILE \
            AWS_DEFAULT_PROFILE \
            AWS_ROLE_ARN \
            AWS_WEB_IDENTITY_TOKEN_FILE
          export AWS_CONFIG_FILE=/dev/null
          export AWS_SHARED_CREDENTIALS_FILE=/dev/null
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_IGNORE_CONFIGURED_ENDPOINT_URLS=true
          export AWS_MAX_ATTEMPTS=1
          export AWS_PAGER=""
          export AWS_REGION=us-east-1

          if ! /usr/bin/timeout --signal=KILL 30s \
            "$aws_cli" sts assume-role-with-web-identity \
            --role-arn "$expected_role_arn" \
            --role-session-name release-proof \
            --duration-seconds 900 \
            --web-identity-token "file://${oidc_token}" \
            --region us-east-1 \
            --output json \
            --cli-connect-timeout 10 \
            --cli-read-timeout 20 \
            --no-cli-pager \
            >"$sts_response" 2>"$error_file"; then
            fail_closed_stage AWS_IDENTITY_STAGE_STS_ASSUME_REQUEST
          fi
          if ! /usr/bin/jq -e \
            --arg expected_arn "$expected_caller_arn" \
            'type == "object" and
             (.Credentials | type == "object") and
             (.Credentials.AccessKeyId |
              type == "string" and test("^ASIA[A-Z0-9]{16}$")) and
             (.Credentials.SecretAccessKey |
              type == "string" and length >= 16) and
             (.Credentials.SessionToken |
              type == "string" and length >= 16) and
             (.AssumedRoleUser.Arn == $expected_arn) and
             (.AssumedRoleUser.AssumedRoleId |
              type == "string" and
              test("^AROA[A-Z0-9]{12,124}:release-proof$"))' \
            "$sts_response" >/dev/null 2>"$error_file"; then
            fail_closed_stage AWS_IDENTITY_STAGE_STS_ASSUME_RECEIPT
          fi

          if ! assumed_role_id="$(/usr/bin/jq -r '.AssumedRoleUser.AssumedRoleId' "$sts_response")"; then
            fail_closed_stage AWS_IDENTITY_STAGE_STS_ASSUME_FIELDS
          fi
          if ! AWS_ACCESS_KEY_ID="$(/usr/bin/jq -r '.Credentials.AccessKeyId' "$sts_response")"; then
            fail_closed_stage AWS_IDENTITY_STAGE_STS_ASSUME_FIELDS
          fi
          if ! AWS_SECRET_ACCESS_KEY="$(/usr/bin/jq -r '.Credentials.SecretAccessKey' "$sts_response")"; then
            fail_closed_stage AWS_IDENTITY_STAGE_STS_ASSUME_FIELDS
          fi
          if ! AWS_SESSION_TOKEN="$(/usr/bin/jq -r '.Credentials.SessionToken' "$sts_response")"; then
            fail_closed_stage AWS_IDENTITY_STAGE_STS_ASSUME_FIELDS
          fi
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL oidc_request_url

          if ! /usr/bin/timeout --signal=KILL 30s \
            "$aws_cli" sts get-caller-identity \
            --region us-east-1 \
            --output json \
            --cli-connect-timeout 10 \
            --cli-read-timeout 20 \
            --no-cli-pager \
            >"$caller_receipt" 2>"$error_file"; then
            fail_closed_stage AWS_IDENTITY_STAGE_STS_CALLER_REQUEST
          fi
          if ! /usr/bin/jq -e \
            --arg account "$AWS_ACCOUNT_ID" \
            --arg expected_arn "$expected_caller_arn" \
            --arg assumed_role_id "$assumed_role_id" \
            'type == "object" and
             (keys | sort) == ["Account", "Arn", "UserId"] and
             .Account == $account and
             .Arn == $expected_arn and
             .UserId == $assumed_role_id and
             (.UserId | type == "string" and
              test("^AROA[A-Z0-9]{12,124}:release-proof$"))' \
            "$caller_receipt" >/dev/null 2>"$error_file"; then
            fail_closed_stage AWS_IDENTITY_STAGE_STS_CALLER_RECEIPT
          fi

          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN assumed_role_id
          if ! printf '%s\n' "$RECEIPT_ENCRYPTION_PASSPHRASE" \
            >"$passphrase_file"; then
            fail_closed_stage AWS_IDENTITY_STAGE_RECEIPT_ENCRYPTION_PREPARE
          fi
          unset RECEIPT_ENCRYPTION_PASSPHRASE
          if ! /usr/bin/rm -f -- "$encrypted_receipt"; then
            fail_closed_stage AWS_IDENTITY_STAGE_RECEIPT_ENCRYPTION_PREPARE
          fi
          if ! /usr/bin/timeout --signal=KILL 30s \
            /usr/bin/gpg \
              --no-options \
              --homedir "$gnupg_home" \
              --batch \
              --yes \
              --pinentry-mode loopback \
              --no-symkey-cache \
              --passphrase-file "$passphrase_file" \
              --symmetric \
              --cipher-algo AES256 \
              --output "$encrypted_receipt" \
              "$caller_receipt" \
            >/dev/null 2>"$error_file"; then
            fail_closed_stage AWS_IDENTITY_STAGE_RECEIPT_ENCRYPTION
          fi
          if ! /usr/bin/chmod 600 "$encrypted_receipt"; then
            fail_closed_stage AWS_IDENTITY_STAGE_ENCRYPTED_RECEIPT
          fi
          if [[ ! -s "$encrypted_receipt" ]]; then
            fail_closed_stage AWS_IDENTITY_STAGE_ENCRYPTED_RECEIPT
          fi
          if ! /usr/bin/gpgconf --homedir "$gnupg_home" --kill all \
            >/dev/null 2>"$error_file"; then
            fail_closed_stage AWS_IDENTITY_STAGE_RECEIPT_ENCRYPTION_CLEANUP
          fi
          [[ -d "$gnupg_home" && ! -L "$gnupg_home" ]] || \
            fail_closed_stage AWS_IDENTITY_STAGE_RECEIPT_ENCRYPTION_CLEANUP
          if ! /usr/bin/rm -rf -- "$gnupg_home"; then
            fail_closed_stage AWS_IDENTITY_STAGE_RECEIPT_ENCRYPTION_CLEANUP
          fi
          if [[ -e "$gnupg_home" || -L "$gnupg_home" ]]; then
            fail_closed_stage AWS_IDENTITY_STAGE_RECEIPT_ENCRYPTION_CLEANUP
          fi
          gnupg_home=""

      - name: Upload encrypted caller identity receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aws-preflight-caller-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aws-preflight-caller-receipt.json.gpg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

      - name: Remove encrypted receipt from runner
        if: always()
        shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BASH_ENV: ""
          ENV: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
        run: /usr/bin/rm -f -- "${RUNNER_TEMP}/aws-preflight-caller-receipt.json.gpg"
